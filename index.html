<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>New Tab — Aurora</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:,"><meta name="theme-color" content="#0b1220">
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js" defer></script>
  <script src="/js/app.js" defer></script>
</head>
<body>
  <div id="background-layer"></div>
  <div id="particles-container"></div>

  <header class="topbar">
    <div class="left">
      <button id="menu-toggle" aria-label="Open menu">☰</button>
      <div id="greeting">welcome, <span id="greet-name">𝕒𝕦𝕣𝕠𝕣𝕒</span></div>
    </div>
    <div class="right">
      <button id="settings-toggle" aria-label="Settings">⚙️</button>
      <button id="login-btn">Login</button>
    </div>
  </header>

  <main class="center">
    <div class="search-card">
      <form id="search-form" target="_blank">
        <input id="search-input" type="search" placeholder="Search the web" autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <div class="below">Search engine: <span id="engine-label">Bing</span></div>
    </div>
  </main>

  <nav id="left-menu" class="menu hidden">
    <h3>Particles</h3>
    <div id="particle-presets" class="presets"></div>
    <hr>
    <h3>Background</h3>
    <div class="bg-controls">
      <button data-action="gradient">Random Gradient</button>
      <label class="file"><input id="bg-upload" type="file" accept="image/*"> Upload Image</label>
      <button id="ai-gen">AI Generate (requires proxy)</button>
      <div class="preview" id="bg-preview"></div>
    </div>
    <hr>
    <h3>Appearance</h3>
    <label><input id="show-greeting" type="checkbox"> Show Greeting</label>
    <label><input id="show-particles" type="checkbox" checked> Show Particles</label>
    <hr>
    <h3>Advanced</h3>
    <label>Particle density <input id="density" type="range" min="10" max="200" value="60"></label>
  </nav>

  <aside id="settings" class="hidden panel">
    <h2>Settings</h2>
    <label>Search engine
      <select id="search-engine">
        <option value="bing">Bing</option>
        <option value="google">Google</option>
      </select>
    </label>
    <label>Greeting name <input id="user-name" placeholder="𝕒𝕦𝕣𝕠𝕣𝕒"></label>
    <label>Greeting rotation
      <select id="greet-mode">
        <option value="rotate">Rotate messages</option>
        <option value="random">Random</option>
      </select>
    </label>
    <label>AI generation endpoint (optional)
      <input id="ai-endpoint" placeholder="https://your-proxy.example.com/generate" />
    </label>
    <button id="save-settings">Save</button>
    <button id="reset-settings">Reset</button>
  </aside>

  <!-- Login Modal -->
  <div id="login-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Login</h2>
      <input id="login-username" placeholder="Enter display name (no password stored)" />
      <div class="modal-actions">
        <button id="login-save">Save</button>
        <button id="login-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <footer class="footer">Made with ✨ — Customize in Settings</footer>
</body>
</html>
