<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Work • Aurora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-600 via-green-500 to-purple-700 text-white flex flex-col items-center py-10 px-6">
  <header class="text-center mb-8">
    <h1 class="text-5xl font-bold drop-shadow-lg">My Work</h1>
    <p class="text-lg mt-3 opacity-90">Public repositories from GitHub</p>
  </header>
  <nav aria-label="Main navigation" class="mb-10 flex flex-wrap justify-center gap-3">
    <a class="rounded-full bg-white/20 px-5 py-2 font-semibold hover:bg-white/30 focus:outline-none focus:ring-2 focus:ring-white" href="index.html">Home</a>
    <a class="rounded-full bg-white/20 px-5 py-2 font-semibold hover:bg-white/30 focus:outline-none focus:ring-2 focus:ring-white" href="games.html">Games</a>
    <a class="rounded-full bg-white/20 px-5 py-2 font-semibold hover:bg-white/30 focus:outline-none focus:ring-2 focus:ring-white" href="search.html">Search</a>
    <a class="rounded-full bg-white/20 px-5 py-2 font-semibold hover:bg-white/30 focus:outline-none focus:ring-2 focus:ring-white" href="work.html" aria-current="page">Work</a>
  </nav>
  <main class="w-full max-w-5xl">
    <p class="mb-6 text-center opacity-90">The list loads from the GitHub public API. Projects explicitly labeled as malware are not shown here.</p>
    <p id="status" class="mb-6 text-center" role="status" aria-live="polite">Loading repositories…</p>
    <section id="repo-list" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3" aria-label="GitHub repositories"></section>
  </main>
  <footer class="mt-12 text-center text-sm opacity-70">© 2026 Sparsh Thakkar</footer>
  <script>
    const status = document.getElementById('status');
    const list = document.getElementById('repo-list');
    const username = 'sthakkar0720';

    function makeCard(repo) {
      const card = document.createElement('article');
      card.className = 'rounded-2xl bg-white/10 p-6 shadow-xl backdrop-blur-md';
      const title = document.createElement('h2');
      title.className = 'mb-2 text-xl font-semibold';
      const link = document.createElement('a');
      link.className = 'underline decoration-white/60 underline-offset-4 hover:decoration-white';
      link.href = repo.html_url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = repo.name;
      title.append(link);
      const description = document.createElement('p');
      description.className = 'min-h-12 text-sm opacity-90';
      description.textContent = repo.description || 'No description yet.';
      card.append(title, description);
      if (repo.language) {
        const language = document.createElement('p');
        language.className = 'mt-4 text-xs opacity-75';
        language.textContent = `Language: ${repo.language}`;
        card.append(language);
      }
      return card;
    }

    async function loadRepositories() {
      try {
        const repos = [];
        for (let page = 1; page <= 10; page += 1) {
          const response = await fetch(`https://api.github.com/users/${username}/repos?type=owner&sort=updated&per_page=100&page=${page}`);
          if (!response.ok) throw new Error('GitHub could not load the repositories right now.');
          const batch = await response.json();
          repos.push(...batch);
          if (batch.length < 100) break;
        }
        // Avoid featuring repositories whose own title or description labels them as malware.
        const projects = repos.filter((repo) => !`${repo.name} ${repo.description || ''}`.toLowerCase().includes('malware'));
        if (!projects.length) {
          status.textContent = 'No public repositories to show yet.';
          return;
        }
        projects.forEach((repo) => list.append(makeCard(repo)));
        status.textContent = `Showing ${projects.length} public ${projects.length === 1 ? 'repository' : 'repositories'}, recently updated first.`;
      } catch (error) {
        status.textContent = `${error.message} You can also browse the profile on GitHub.`;
        const profile = document.createElement('a');
        profile.href = `https://github.com/${username}?tab=repositories`;
        profile.target = '_blank';
        profile.rel = 'noopener noreferrer';
        profile.className = 'ml-1 underline';
        profile.textContent = 'Open GitHub repositories';
        status.append(profile);
      }
    }
    loadRepositories();
  </script>
</body>
</html>
