<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search • Aurora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-600 via-green-500 to-purple-700 text-white flex flex-col items-center py-10 px-6">
  <header class="text-center mb-8">
    <h1 class="text-5xl font-bold drop-shadow-lg">Search</h1>
    <p class="text-lg mt-3 opacity-90">Find something out there on the web</p>
  </header>
  <nav aria-label="Main navigation" class="mb-10 flex flex-wrap justify-center gap-3">
    <a class="rounded-full bg-white/20 px-5 py-2 font-semibold hover:bg-white/30 focus:outline-none focus:ring-2 focus:ring-white" href="index.html">Home</a>
    <a class="rounded-full bg-white/20 px-5 py-2 font-semibold hover:bg-white/30 focus:outline-none focus:ring-2 focus:ring-white" href="games.html">Games</a>
    <a class="rounded-full bg-white/20 px-5 py-2 font-semibold hover:bg-white/30 focus:outline-none focus:ring-2 focus:ring-white" href="search.html" aria-current="page">Search</a>
    <a class="rounded-full bg-white/20 px-5 py-2 font-semibold hover:bg-white/30 focus:outline-none focus:ring-2 focus:ring-white" href="work.html">Work</a>
  </nav>
  <main class="w-full max-w-2xl rounded-2xl bg-white/10 p-8 text-center shadow-xl backdrop-blur-md">
    <h2 class="mb-3 text-3xl font-semibold">Search the web</h2>
    <p class="mb-6 opacity-90">This sends your search to Google in a new tab.</p>
    <form action="https://www.google.com/search" method="get" target="_blank" class="flex flex-col gap-3 sm:flex-row" role="search">
      <label class="sr-only" for="query">Search query</label>
      <input id="query" name="q" type="search" required autocomplete="off" placeholder="What are you curious about?" class="min-w-0 flex-1 rounded-full border border-white/40 bg-white/90 px-5 py-3 text-slate-900 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-200" />
      <button type="submit" class="rounded-full bg-white px-7 py-3 font-semibold text-indigo-700 hover:bg-indigo-100 focus:outline-none focus:ring-2 focus:ring-white">Search</button>
    </form>
    <p class="mt-5 text-sm opacity-75">Your search query is sent to Google, not stored on this site.</p>
  </main>
  <footer class="mt-12 text-center text-sm opacity-70">© 2026 Sparsh Thakkar</footer>
</body>
</html>
